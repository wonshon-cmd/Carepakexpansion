<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style></head><body>
<style>
.lfnav{position:sticky;top:0;z-index:50;background:#111827;color:#e5e7eb;font:500 14px "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.lfnav a{color:#e5e7eb;text-decoration:none;padding:6px 9px;border-radius:8px;white-space:nowrap}
.lfnav a:hover{background:#1f2937}
.lfnav a[aria-current="page"]{background:#1f5fd6;color:#fff}
.lfnav .brand{font-weight:700;color:#fff;margin-right:2px}
.lfnav .real{color:#fecaca;border:1px solid #7f1d1d}
.lfnav .test{color:#bbf7d0;border:1px solid #14532d}
.lfnav .sp{flex:1}
.lfnav .back{font:inherit;color:#fff;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:6px 12px;cursor:pointer;margin-right:4px}
.lfnav .back:hover{background:#374151}
</style>
<nav class="lfnav" aria-label="Loan Floor menu">
  <button type="button" class="back" id="lfBack" title="Back to the previous page">← Back</button>
  <a class="brand" href="Loan-Floor-offline.html">Loan Floor</a>
  <a href="Loan-Floor-offline.html" data-page="program">Program</a>
  <a href="Practice.html#web" data-page="web">How to use · Program</a>
  <a href="Practice.html#sheet" data-page="sheet">How to use · Sheet</a>
  <a href="Workflow.html" data-page="workflow">Workflow</a>
  <span class="sp"></span>
  <a class="test" href="https://docs.google.com/spreadsheets/d/1OKJ-hPE26-xSvTBSW-o1qQ8YTFYOuiuua8sOu9V7qJk/edit?usp=sharing" target="_blank" rel="noopener" title="Practice copy, type anything">TEST &amp; PRACTICE ↗</a>
  <a class="real" href="https://docs.google.com/spreadsheets/d/1rxMJrqUcFL1y4Q-48_IiZNxnorFBIMfMP-exQzGFRN0/edit?usp=sharing" target="_blank" rel="noopener" title="The real sheet for the 15-minute run">REAL · do not touch ↗</a>
</nav>
<script>(function(){
function mark(){var path=location.pathname;var q=path.indexOf("Workflow")>-1?"workflow":path.indexOf("Practice")>-1?(location.hash==="#sheet"?"sheet":"web"):"program";
document.querySelectorAll(".lfnav [data-page]").forEach(function(a){a.toggleAttribute("aria-current",a.dataset.page===q);if(a.dataset.page===q)a.setAttribute("aria-current","page");});}
mark();window.addEventListener("hashchange",mark);
function navh(){document.documentElement.style.setProperty("--navh",document.querySelector(".lfnav").offsetHeight+"px");}
navh();window.addEventListener("resize",navh);
document.getElementById("lfBack").addEventListener("click",function(){if(history.length>1)history.back();else location.href="Loan-Floor-offline.html";});})();</script>
<title>Loan Floor Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one flowchart, black lines on white; colour only where a loan's fate is decided. */
:root{
  --bg:#ffffff; --ink:#111111; --muted:#555f6d; --box:#ffffff;
  --g-bg:#c6efce; --g-fg:#006100; --y-bg:#ffeb9c; --y-fg:#7a4600; --r-bg:#ffc7ce; --r-fg:#9c0006;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --ink:#e8ecf1; --muted:#9aa5b5; --box:#171e28;
  --g-bg:#173d24; --g-fg:#8fe0a8; --y-bg:#463a12; --y-fg:#f3d27a; --r-bg:#4a1e24; --r-fg:#ffb3bc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --ink:#e8ecf1; --muted:#9aa5b5; --box:#171e28;
  --g-bg:#173d24; --g-fg:#8fe0a8; --y-bg:#463a12; --y-fg:#f3d27a; --r-bg:#4a1e24; --r-fg:#ffb3bc; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f)}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin:0 0 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:18px;height:14px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block}
.chart{overflow-x:auto}
svg{width:100%;min-width:720px;height:auto;display:block}
svg text{font-family:var(--f);fill:var(--ink)}
.line{stroke:var(--ink);stroke-width:2;fill:none}
.bx{stroke:var(--ink);stroke-width:2;fill:var(--box)}
.g{fill:var(--g-bg)} .y{fill:var(--y-bg)} .r{fill:var(--r-bg)}
.tg{fill:var(--g-fg)!important} .ty{fill:var(--y-fg)!important} .tr{fill:var(--r-fg)!important}
.t1{font-size:17px;font-weight:700}
.t2{font-size:13.5px}
.lab{font-size:14px;font-weight:700}
.arrowhead{fill:var(--ink)}
</style>

<div class="wrap">
  <h1>Loan Floor workflow</h1>
  <div class="legend">
    <span><i style="background:var(--g-bg)"></i>Green · QUALIFIED / APPROVED</span>
    <span><i style="background:var(--y-bg)"></i>Yellow · NEED DATA (85–100%): one paste from the Back Ratio page</span>
    <span><i style="background:var(--r-bg)"></i>Red · NOT QUALIFIED / REJECT</span>
    <span><i style="background:var(--box)"></i>White · a step you do</span>
  </div>
  <div class="chart">
  <svg viewBox="0 0 1000 1030" role="img" aria-labelledby="wfT wfD">
    <title id="wfT">Loan Floor workflow</title>
    <desc id="wfD">Open the application, do the LTV. Over 100% is red: reject. Under 85% is green: qualified, the puzzle person approves. 85 to 100% is yellow: paste the 5 amounts from the Back Ratio page, which gives both ratios; if Back is under 35% and Front under 25% it is qualified, otherwise red: reject. Every loan ends with mark done, close the tab, next application.</desc>
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>

    <!-- start -->
    <rect class="bx" x="300" y="14" width="400" height="62" rx="31"/>
    <text x="500" y="40" text-anchor="middle" class="t1">Open the application</text>
    <text x="500" y="61" text-anchor="middle" class="t2">Ctrl/⌘+click opens it in a new tab</text>
    <path class="line" d="M500,76 V112" marker-end="url(#ah)"/>

    <!-- LTV step -->
    <rect class="bx" x="240" y="114" width="520" height="74" rx="8"/>
    <text x="500" y="143" text-anchor="middle" class="t1">Loan-to-Value page</text>
    <text x="500" y="167" text-anchor="middle" class="t2">Copy L, H, V → paste → type the LTV % in the dropdown → Submit</text>
    <path class="line" d="M500,188 V222" marker-end="url(#ah)"/>

    <!-- decision 1 -->
    <polygon class="bx" points="500,224 620,282 500,340 380,282"/>
    <text x="500" y="287" text-anchor="middle" class="t1">LTV?</text>

    <!-- branches -->
    <path class="line" d="M380,282 H170 V398" marker-end="url(#ah)"/>
    <text x="275" y="272" text-anchor="middle" class="lab">over 100%</text>
    <path class="line" d="M500,340 V398" marker-end="url(#ah)"/>
    <text x="512" y="372" class="lab">under 85%</text>
    <path class="line" d="M620,282 H830 V398" marker-end="url(#ah)"/>
    <text x="725" y="272" text-anchor="middle" class="lab">85–100%</text>

    <!-- red 1 -->
    <rect class="bx r" x="40" y="400" width="260" height="96" rx="8"/>
    <text x="170" y="432" text-anchor="middle" class="t1 tr">✗ NOT QUALIFIED</text>
    <text x="170" y="456" text-anchor="middle" class="t2">Next Task → Next Task</text>
    <text x="170" y="477" text-anchor="middle" class="t2">→ Reject Loan</text>

    <!-- green 1 -->
    <rect class="bx g" x="370" y="400" width="260" height="96" rx="8"/>
    <text x="500" y="432" text-anchor="middle" class="t1 tg">✓ QUALIFIED</text>
    <text x="500" y="456" text-anchor="middle" class="t2">Next Application.</text>
    <text x="500" y="477" text-anchor="middle" class="t2">The puzzle person takes it.</text>

    <!-- yellow -->
    <rect class="bx y" x="700" y="400" width="260" height="96" rx="8"/>
    <text x="830" y="432" text-anchor="middle" class="t1 ty">NEED DATA</text>
    <text x="830" y="456" text-anchor="middle" class="t2">Back Ratio page: copy all 5 → paste</text>
    <text x="830" y="477" text-anchor="middle" class="t2">Back % and Front % both appear</text>
    <path class="line" d="M830,496 V532" marker-end="url(#ah)"/>

    <!-- decision 2 -->
    <polygon class="bx" points="830,534 960,600 830,666 700,600"/>
    <text x="830" y="596" text-anchor="middle" class="t2" style="font-weight:700">Back under 35%</text>
    <text x="830" y="616" text-anchor="middle" class="t2" style="font-weight:700">and Front under 25%?</text>
    <path class="line" d="M700,600 H634" marker-end="url(#ah)"/>
    <text x="667" y="590" text-anchor="middle" class="lab">yes</text>
    <path class="line" d="M830,666 V738" marker-end="url(#ah)"/>
    <text x="842" y="706" class="lab">no</text>

    <!-- puzzle person -->
    <path class="line" d="M500,496 V553" marker-end="url(#ah)"/>
    <rect class="bx" x="370" y="555" width="260" height="92" rx="8"/>
    <text x="500" y="583" text-anchor="middle" class="t1">Risk Assessment</text>
    <text x="500" y="606" text-anchor="middle" class="t2">Count FIRE, FLOOD, HEAT,</text>
    <text x="500" y="626" text-anchor="middle" class="t2">SOIL, WIND → Submit</text>
    <path class="line" d="M500,647 V698" marker-end="url(#ah)"/>
    <rect class="bx" x="370" y="700" width="260" height="78" rx="8"/>
    <text x="500" y="730" text-anchor="middle" class="t1">Decision</text>
    <text x="500" y="755" text-anchor="middle" class="t2">Click the rate % (= words found)</text>
    <path class="line" d="M500,778 V818" marker-end="url(#ah)"/>
    <rect class="bx g" x="370" y="820" width="260" height="62" rx="8"/>
    <text x="500" y="848" text-anchor="middle" class="t1 tg">✓ APPROVED</text>
    <text x="500" y="869" text-anchor="middle" class="t2">click Approve Loan</text>

    <!-- red 2 -->
    <rect class="bx r" x="700" y="740" width="260" height="96" rx="8"/>
    <text x="830" y="772" text-anchor="middle" class="t1 tr">✗ NOT QUALIFIED</text>
    <text x="830" y="796" text-anchor="middle" class="t2">Type Back %, Front % → Submit</text>
    <text x="830" y="817" text-anchor="middle" class="t2">→ Decision → Reject Loan</text>

    <!-- to the end -->
    <path class="line" d="M170,496 V938" marker-end="url(#ah)"/>
    <path class="line" d="M500,882 V938" marker-end="url(#ah)"/>
    <path class="line" d="M830,836 V938" marker-end="url(#ah)"/>
    <rect class="bx" x="40" y="940" width="920" height="74" rx="37"/>
    <text x="500" y="970" text-anchor="middle" class="t1">Mark it done · Ctrl/⌘+W closes the tab · next application</text>
    <text x="500" y="994" text-anchor="middle" class="t2">Program: press the blue button.   Google Sheet: Clicked in bank panel? = Yes</text>
  </svg>
  </div>
</div>

</body></html>
